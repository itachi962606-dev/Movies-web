{% extends "base.html" %}

{% block title %}Movie Details - MoviesHub{% endblock %}

{% block content %}
<div class="detail-wrap" id="detail-wrap">
  <div class="loading" id="detail-loader" style="min-height: 60vh;"><div class="spinner"></div></div>

  <div id="detail-container" style="display: none;">
    <!-- Backdrop banner with dark fade -->
    <div class="detail-backdrop" id="detail-backdrop">
      <div class="detail-backdrop-grad"></div>
    </div>

    <!-- Main Detail Content -->
    <div class="detail-content">
      <div class="detail-poster" id="detail-poster">
        <!-- Rendered dynamically -->
      </div>
      <div class="detail-info">
        <h1 class="detail-title" id="detail-title"></h1>
        <div class="detail-rating" id="detail-rating"></div>
        <div class="detail-tags" id="detail-tags"></div>
        <p class="detail-desc" id="detail-desc"></p>
        <div class="detail-actions">
          <button id="btn-detail-wl" class="btn btn-primary">❤️ Add to Watchlist</button>
          <button id="btn-detail-bl" class="btn btn-accent">⭐ Add to Best List</button>
          <a href="/movies" class="btn btn-secondary">&larr; Back to Catalogue</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const movieId = "{{ movie_id }}";
  const loader = document.getElementById("detail-loader");
  const container = document.getElementById("detail-container");
  const backdrop = document.getElementById("detail-backdrop");
  const posterWrap = document.getElementById("detail-poster");
  const title = document.getElementById("detail-title");
  const rating = document.getElementById("detail-rating");
  const tags = document.getElementById("detail-tags");
  const desc = document.getElementById("detail-desc");
  const wlBtn = document.getElementById("btn-detail-wl");
  const blBtn = document.getElementById("btn-detail-bl");

  try {
    const res = await fetch(`/api/movies/${movieId}`);
    if (!res.ok) {
      loader.innerHTML = `
        <div class="empty-state">
          <h3>Movie Not Found</h3>
          <p>This movie could not be located in the TMDB catalogue or is restricted.</p>
          <a href="/movies" class="btn btn-primary" style="margin-top:1rem;">Back to Movies</a>
        </div>
      `;
      return;
    }

    const movie = await res.json();
    loader.style.display = "none";
    container.style.display = "block";

    // Set page title
    document.title = `${movie.title} - MoviesHub`;

    // Backdrop
    if (movie.backdrop_path) {
      backdrop.style.backgroundImage = `url('${window.MH.backdropUrl(movie.backdrop_path)}')`;
    }

    // Poster
    if (movie.poster_path) {
      posterWrap.innerHTML = `<img src="${window.MH.posterUrl(movie.poster_path)}" alt="${window.MH.escHtml(movie.title)}">`;
    } else {
      posterWrap.innerHTML = `<div class="movie-card-poster-placeholder" style="height:330px; font-size:4rem;">🎬</div>`;
    }

    title.textContent = movie.title;
    rating.textContent = movie.vote_average ? `★ ${parseFloat(movie.vote_average).toFixed(1)} / 10 (${movie.vote_count} votes)` : "";

    // Genres & Meta Tags
    tags.innerHTML = "";
    if (movie.release_date) {
      const yearSpan = document.createElement("span");
      yearSpan.className = "tag";
      yearSpan.textContent = `Year: ${movie.release_date.slice(0, 4)}`;
      tags.appendChild(yearSpan);
    }
    if (movie.runtime) {
      const runSpan = document.createElement("span");
      runSpan.className = "tag";
      runSpan.textContent = `${movie.runtime} mins`;
      tags.appendChild(runSpan);
    }
    if (movie.genres && movie.genres.length) {
      movie.genres.forEach(g => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = g.name;
        tags.appendChild(span);
      });
    }

    desc.textContent = movie.overview || "No overview available for this movie.";

    // Watchlist state & handler
    function updateWlState() {
      const active = window.MH.isInWatchlist(movie.id, "tmdb");
      wlBtn.innerHTML = active ? "❤️ In Watchlist" : "🤍 Add to Watchlist";
      wlBtn.className = active ? "btn btn-secondary" : "btn btn-primary";
    }
    updateWlState();
    wlBtn.addEventListener("click", () => {
      window.MH.toggleWatchlist(movie, "tmdb");
      updateWlState();
    });

    // Best list state & handler
    function updateBlState() {
      const active = window.MH.isInBestList(movie.id, "tmdb");
      blBtn.innerHTML = active ? "⭐ In Best List" : "☆ Add to Best List";
    }
    updateBlState();
    blBtn.addEventListener("click", () => {
      window.MH.toggleBestList(movie, "tmdb");
      updateBlState();
    });

  } catch (err) {
    loader.innerHTML = `<p style="color:#f87171; text-align:center;">Failed to load movie details: ${err.message}</p>`;
  }
});
</script>
{% endblock %}
