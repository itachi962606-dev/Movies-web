{% extends "base.html" %}

{% block title %}International Movies - MoviesHub{% endblock %}

{% block content %}
<header class="page-hero">
  <h1>International Movies</h1>
  <p>Browse global cinema powered by TMDB. Filter by genre, release year, or search for titles.</p>
</header>

<!-- Filter Toolbar -->
<section class="filters-bar">
  <input type="text" id="filter-search" class="filter-input" placeholder="Search by title (e.g. Inception, Avatar)...">
  <select id="filter-genre" class="filter-select">
    <option value="">All Genres</option>
  </select>
  <select id="filter-year" class="filter-select">
    <option value="">All Years</option>
    <option value="2026">2026</option>
    <option value="2025">2025</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
    <option value="2021">2021</option>
    <option value="2020">2020</option>
    <option value="2010">2010s</option>
    <option value="2000">2000s</option>
  </select>
  <button id="btn-apply-filters" class="btn btn-primary btn-sm">Filter</button>
  <button id="btn-reset-filters" class="btn btn-outline btn-sm">Reset</button>
</section>

<!-- Movies Grid -->
<section class="section" style="padding-top: 0;">
  <div id="movies-container" class="movies-grid">
    <div class="loading"><div class="spinner"></div></div>
  </div>

  <!-- Pagination Controls -->
  <div class="pagination" id="movies-pagination" style="display: none;">
    <button class="page-btn" id="page-prev">&lsaquo;</button>
    <span id="page-info" style="font-size:0.85rem; color:var(--text-muted); margin: 0 0.5rem;">Page 1</span>
    <button class="page-btn" id="page-next">&rsaquo;</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const container = document.getElementById("movies-container");
  const pagination = document.getElementById("movies-pagination");
  const pageInfo = document.getElementById("page-info");
  const prevBtn = document.getElementById("page-prev");
  const nextBtn = document.getElementById("page-next");

  const searchInput = document.getElementById("filter-search");
  const genreSelect = document.getElementById("filter-genre");
  const yearSelect = document.getElementById("filter-year");
  const filterBtn = document.getElementById("btn-apply-filters");
  const resetBtn = document.getElementById("btn-reset-filters");

  let currentPage = 1;
  let totalPages = 1;

  // Check URL query parameters for initial state
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has("query")) {
    searchInput.value = urlParams.get("query");
  }

  // Populate genres
  async function loadGenres() {
    try {
      const res = await fetch("/api/genres");
      const genres = await res.json();
      genres.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g.id;
        opt.textContent = g.name;
        genreSelect.appendChild(opt);
      });
    } catch (e) {
      console.warn("Could not load genres:", e);
    }
  }
  loadGenres();

  async function fetchMovies(page = 1) {
    currentPage = page;
    container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    const q = searchInput.value.trim();
    const g = genreSelect.value;
    const y = yearSelect.value;

    const params = new URLSearchParams({ page });
    if (q) params.set("query", q);
    if (g) params.set("genre", g);
    if (y) params.set("year", y);

    try {
      const res = await fetch(`/api/movies?${params}`);
      const data = await res.json();

      container.innerHTML = "";
      const list = data.results || [];
      totalPages = data.total_pages || 1;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">🎬</div>
            <h3>No movies found</h3>
            <p>Try searching with another title or adjusting your filters.</p>
          </div>
        `;
        pagination.style.display = "none";
        return;
      }

      list.forEach(m => {
        container.appendChild(window.MH.buildTmdbCard(m));
      });

      pagination.style.display = "flex";
      pageInfo.textContent = `Page ${currentPage} of ${Math.min(totalPages, 500)}`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    } catch (err) {
      container.innerHTML = `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <p style="color:#f87171;">Failed to load movies. ${err.message}</p>
        </div>
      `;
      pagination.style.display = "none";
    }
  }

  filterBtn.addEventListener("click", () => fetchMovies(1));
  searchInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") fetchMovies(1);
  });
  resetBtn.addEventListener("click", () => {
    searchInput.value = "";
    genreSelect.value = "";
    yearSelect.value = "";
    fetchMovies(1);
  });

  prevBtn.addEventListener("click", () => {
    if (currentPage > 1) {
      fetchMovies(currentPage - 1);
      window.scrollTo({ top: 200, behavior: "smooth" });
    }
  });

  nextBtn.addEventListener("click", () => {
    if (currentPage < totalPages) {
      fetchMovies(currentPage + 1);
      window.scrollTo({ top: 200, behavior: "smooth" });
    }
  });

  fetchMovies(1);
});
</script>
{% endblock %}
